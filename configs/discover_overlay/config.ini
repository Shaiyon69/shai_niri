# Discover Overlay (Discord voice overlay). Colors are red-green colorblind safe.
# Mod+N in niri toggles icon_only (names on/off).
[main]
floating = False
topalign = 1
avatar_size = 22
square_avatar = False
fancy_border = False
border_width = 2
icon_spacing = 4
text_padding = 4
nick_length = 16
only_speaking = False
only_speaking_grace = 3
fade_out_inactive = False
inactive_time = 10
inactive_fade_time = 20
fade_out_limit = 0.3
bg_col = [0.0,0.0,0.0,0.0]
mt_bg_col = [0.07,0.07,0.09,0.55]
hi_col = [0.0,0.0,0.0,0.0]
fg_col = [0.80,0.82,0.90,0.80]
fg_hi_col = [1.0,1.0,1.0,1.0]
tk_col = [0.94,0.89,0.26,1.0]
mt_col = [0.80,0.47,0.65,1.0]
bo_col = [0.0,0.0,0.0,0.0]
show_title = False
show_connection = False
show_disconnected = False
vert_edge_padding = 48
horz_edge_padding = 16
font = Noto Sans Bold 9
icon_only = True

