id = "shaiyon/shortcuts"
name = "Shortcuts"
version = "1.2.0"
plugin_api = 43
author = "shaiyon"
license = "MIT"
icon = "photo"
description = "Control center tiles (Wallpaper, Tools) and the small panels they open."
tags = [ "utility" ]
dependencies = ["nmcli", "bluetoothctl", "wpctl"]

[[shortcut]]
id = "wallpaper"
entry = "wallpaper.luau"

# Narrow picker: two thumbnail columns, grows to fit, centered on the bar.
[[panel]]
id = "picker"
entry = "picker.luau"
width = 380
height = "content"
max_height = 760
placement = "attached"
position = "center"
keyboard_focus = "on_demand"

[[shortcut]]
id = "tools"
entry = "tools-tile.luau"

# Small list of tool panels (LocalSend, Tailscale, Downloads), opened from the Tools tile.
[[panel]]
id = "toolbox"
entry = "tools.luau"
width = 320
height = "content"
max_height = 600
placement = "attached"
position = "center"
keyboard_focus = "on_demand"

# Bar icons drawn from the same Tabler outline set as home and the launcher, so all
# icons in the pill share one size and stroke. Click opens the matching Home tab.
[[widget]]
id = "wifi"
entry = "wifi.luau"

[[widget]]
id = "bluetooth"
entry = "bluetooth.luau"

[[widget]]
id = "volume"
entry = "volume.luau"
