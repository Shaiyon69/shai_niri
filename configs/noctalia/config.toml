[shell]
polkit_agent = true

[bar.default]
background_opacity = 1.0
compositor_blur = false
center = ["date", "clock"]
end = ["tray", "notifications", "network", "bluetooth", "volume", "control-center", "session"]
padding = 18
widget_spacing = 12

[widget.network]
show_label = false

[widget.control-center]
glyph = "home"

[theme]
pure_black_dark = true # OLED: dark-mode backgrounds become #000000

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4", "alacritty"]

# Fixed day/night times for theme auto (no IP geolocation needed).
[location]
custom_schedule = true
sunrise = "06:30"
sunset = "18:00"
