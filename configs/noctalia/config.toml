[shell]
polkit_agent = true

[bar.default]
# Left edge: on 1920x1080 height is scarcer than width, and niri scrolls sideways.
position = "left"
background_opacity = 1.0
compositor_blur = false
start = ["workspaces"]
center = ["date", "clock"]
end = ["discord", "tray", "gap", "group:conn", "gap", "group:ctrl", "divider", "session"]
padding = 14
# Flush to the left edge, slim.
thickness = 30
widget_spacing = 10
# Circle size as a share of the bar; 0.56 matches the workspace circles.
capsule_thickness = 0.56

# Stacked hour and minute on the vertical bar.
[widget.clock]
vertical_format = "{:%H\n%M}"

[widget.date]
vertical_format = "{:%d\n%b}"

[widget.network]
show_label = false

[widget.control-center]
glyph = "home"

[theme]
pure_black_dark = false

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4", "alacritty", "qt", "niri", "btop"]

# Plugin widgets. Discord hides itself when idle.
[widget.gamermode]
type = "nomadcxx/gamer-mode:gamermode"

[widget.discord]
type = "raycursive/discord-voice:bar"
hide_when_disconnected = true

# Lock after 10 minutes idle, screens off a minute later. No suspend.
[idle.behavior.lock]
enabled = true
timeout = 600

[idle.behavior.screen-off]
enabled = true
timeout = 660

# Night light on a fixed schedule (no location set).
[location]
custom_schedule = true
sunset = "18:00"
sunrise = "06:00"

[nightlight]
enabled = true

[widget.volume]
show_label = false

[widget.tray]
drawer = true
capsule = true
capsule_fill = "#d6e2f5"
capsule_foreground = "#121212"
capsule_padding = 0

# Pills get darker left to right; power is the most saturated blue so it stands out.
[widget.session]
capsule = true
capsule_fill = "#3b82f6"
capsule_foreground = "#121212"
capsule_padding = 0

# Thin line between the status icons and the power button (horizontal on the vertical bar).
[widget.divider]
type = "text"
text = "─"
color = "#5a5d63"

# Extra space between the tray, the icon-group pills and the divider.
[widget.gap]
type = "spacer"
length = 20

# Pills around each icon group.
[[bar.default.capsule_group]]
id = "conn"
members = ["network", "bluetooth", "volume"]
fill = "#adc6ff"
foreground = "#121212"

[[bar.default.capsule_group]]
id = "ctrl"
members = ["gamermode", "notifications", "wallpaper", "control-center", "launcher"]
fill = "#7fa7e0"
foreground = "#121212"

# Workspaces: all circles, the active one is not stretched (icon groups above keep their pills).
[widget.workspaces]
active_pill_size = 1.0
inactive_pill_size = 1.0

# App theming: Noctalia renders these on every theme change.
# Chimaera and Messapp poll their file and restyle live; Steam shows a change after a restart.
[theme.templates.user.chimaera]
input_path = "templates/chimaera.css"
output_path = "$XDG_CONFIG_HOME/shaiyon-theme/chimaera.css"

[theme.templates.user.messapp]
input_path = "templates/messapp.css"
output_path = "$XDG_CONFIG_HOME/shaiyon-theme/messapp.css"

[theme.templates.user.steam_adwsteamgtk]
input_path = "templates/steam-custom.css"
output_path = "$XDG_CONFIG_HOME/AdwSteamGtk/custom.css"
# AdwSteamGtk installs the new colors into Steam, then the CSS speed-up is re-applied.
post_hook = "sh ${XDG_CONFIG_HOME:-$HOME/.config}/noctalia/templates/steam-apply.sh"

# LACT (GTK4) reads the GTK colors only at startup: reopen its window after a change.
[theme.templates.user.lact]
input_path = "templates/lact-stamp.txt"
output_path = "$XDG_CACHE_HOME/shaiyon-theme/lact-stamp.txt"
post_hook = "sh ${XDG_CONFIG_HOME:-$HOME/.config}/noctalia/templates/restart-lact.sh"

# Spotify (Spicetify): restart Spotify to see a theme change.
[theme.templates.user.spicetify]
input_path = "templates/spicetify-color.ini"
output_path = "$XDG_CONFIG_HOME/spicetify/Themes/Noctalia/color.ini"
post_hook = "sh ${XDG_CONFIG_HOME:-$HOME/.config}/noctalia/templates/spicetify-apply.sh"

# Zen: zen-apply.sh copies userChrome.css into the default Zen profile. Restart Zen to see a change.
[theme.templates.user.zen]
input_path = "templates/zen-userChrome.css"
output_path = "$XDG_CACHE_HOME/shaiyon-theme/zen-userChrome.css"
post_hook = "sh ${XDG_CONFIG_HOME:-$HOME/.config}/noctalia/templates/zen-apply.sh"

# VSCodium: the local "Noctalia" theme extension. Reload the window to see a change.
[theme.templates.user.vscodium]
input_path = "templates/vscodium-theme.json"
output_path = "~/.vscode-oss/extensions/shaiyon.noctalia-theme-1.0.0/themes/noctalia.json"

# Toasts: small, no app name, at most 3 on screen, newest on top. Layer "top" keeps them under fullscreen games.
[notification]
position = "top_right"
layer = "top"
scale = 0.8
width = 280
max_visible = 3
newest_on_edge = true
show_app_name = false

# Discord and Steam: 4 s toasts, never stuck on screen.
[notification.filter.discord]
enabled = true
match = "discord"
override_duration = 4000
allow_permanent = false

[notification.filter.steam]
enabled = true
match = "steam"
override_duration = 4000
allow_permanent = false
