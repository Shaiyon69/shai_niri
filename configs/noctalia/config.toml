[shell]
polkit_agent = true

[bar.default]
background_opacity = 1.0
compositor_blur = false
start = ["workspaces"]
center = ["date", "clock"]
end = ["tray", "gap", "group:conn", "gap", "group:ctrl", "divider", "session"]
padding = 18
thickness = 30
widget_spacing = 12
# Pill height as a share of the bar; 0.56 matches the workspace circles.
capsule_thickness = 0.56

[widget.network]
show_label = false

[widget.control-center]
glyph = "home"

[theme]
pure_black_dark = false

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4", "alacritty", "qt"]

[widget.volume]
show_label = false

[widget.tray]
drawer = true
capsule = true
capsule_fill = "secondary"
capsule_foreground = "#121212"
capsule_padding = 0

[widget.session]
capsule = true
capsule_fill = "primary"
capsule_foreground = "#121212"
capsule_padding = 0

# Thin vertical line between the status icons and the power button.
[widget.divider]
type = "text"
text = "│"
color = "#5a5d63"

# Extra space between the tray, the icon-group pills and the divider.
[widget.gap]
type = "spacer"
length = 20

# Pills around each icon group.
[[bar.default.capsule_group]]
id = "conn"
members = ["network", "bluetooth", "volume"]
fill = "secondary"
foreground = "#121212"

[[bar.default.capsule_group]]
id = "ctrl"
members = ["notifications", "wallpaper", "control-center", "launcher"]
fill = "secondary"
foreground = "#121212"
