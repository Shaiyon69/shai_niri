[shell]
polkit_agent = true

[bar.default]
background_opacity = 0.35
compositor_blur = true
center = ["date", "clock"]
end = ["tray", "notifications", "network", "bluetooth", "volume", "control-center", "session"]
padding = 18
widget_spacing = 12

[widget.network]
show_label = false

[widget.control-center]
glyph = "home"

[theme]
pure_black_dark = true # OLED: dark-mode backgrounds become #000000

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4", "alacritty"]
