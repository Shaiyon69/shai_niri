[shell]
polkit_agent = true

[bar.default]
background_opacity = 1.0
compositor_blur = false
start = ["workspaces"]
center = ["date", "clock"]
end = ["tray", "gap", "network", "bluetooth", "volume", "gap", "notifications", "wallpaper", "control-center", "launcher", "divider", "session"]
padding = 18
thickness = 30
widget_spacing = 12

[widget.network]
show_label = false

[widget.control-center]
glyph = "home"

[theme]
pure_black_dark = false

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4", "alacritty", "qt"]

[widget.volume]
show_label = false

[widget.tray]
drawer = true

[widget.session]
capsule = true
capsule_fill = "primary"
capsule_foreground = "on_primary"

# Thin vertical line between the status icons and the power button.
[widget.divider]
type = "text"
text = "│"
color = "#5a5d63"

# Extra space between icon groups: tray | connections and sound | notifications, wallpaper, controls, search.
[widget.gap]
type = "spacer"
length = 20
